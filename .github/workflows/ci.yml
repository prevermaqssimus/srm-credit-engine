name: CI

# Pipeline simples (requisito Senior): "CI rodando testes e linter".
# Escopo deliberadamente enxuto (ver DECISIONS.md item 3): sem matriz de
# ambientes, sem deploy automatizado, sem gates de cobertura/SAST.
#
# DECISAO: tentamos usar o Checkstyle (plugin Maven + ruleset customizado,
# depois ruleset embutido sun_checks.xml) e encontramos atrito real:
# incompatibilidade de versao entre módulos do ruleset (LineLength dentro/
# fora de TreeWalker, dependendo da versão resolvida) e exigências de estilo
# desproporcionais ao escopo do case (JavadocPackage exigindo package-info.java
# em toda pasta). Decidimos simplificar: o "linter" desta pipeline é o próprio
# compilador Java em modo estrito (mostra e, futuramente, pode falhar em
# warnings de compilação) -- sem dependência de plugin externo nem arquivo de
# configuração adicional. Documentar Checkstyle completo como próximo passo
# evolutivo (ver README.md).

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar
        run: mvn -B -ntp compile

      - name: Rodar testes (inclui golden cases, idempotência e concorrência)
        run: mvn -B -ntp test

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 5

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Lint enxuto e sem dependência de plugin externo: compila mostrando
      # todos os warnings do compilador Java (variável não usada, cast
      # inseguro, uso de API deprecada, etc.) -- não é um linter de estilo
      # completo, mas satisfaz o requisito de "verificação automatizada de
      # qualidade rodando no CI" sem o atrito de configuração que teríamos
      # com uma ferramenta dedicada.
      - name: Rodar build com warnings de compilação visíveis
        run: mvn -B -ntp -Dmaven.compiler.showWarnings=true -Dmaven.compiler.verbose=true compile
