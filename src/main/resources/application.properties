spring.application.name=srm-credit-engine

# --- Taxa base do motor de precificacao ---
# SPEC.md Secao 1: "taxa base padrao e fixada em 1,00% a.m... sendo injetada
# e gerenciada via arquivo de configuracao externo (application.properties),
# permitindo alteracao dinamica sem recompilacao".
#
# E este valor aqui que o PricingProperties (config/PricingProperties.java)
# le e disponibiliza para injecao via construtor -- ver Passo 2 do plano.
#
# Formato: 0.01 representa 1,00% (fracao decimal, nao percentual literal --
# BigDecimal("0.01"), nao BigDecimal("1")).
pricing.base-rate=0.01

# ============================================================================
# Resilience4j -- retry e circuit breaker para o provedor de cambio
# (Passo 8 do plano). SPEC.md Secao 5: "timeout curto + retry com backoff
# exponencial (maximo N tentativas)" e "circuit breaker monitora
# falhas/timeouts consecutivos (limite configuravel)".
# ============================================================================

# --- Retry ---
resilience4j.retry.instances.exchangeRateProvider.max-attempts=3
resilience4j.retry.instances.exchangeRateProvider.wait-duration=500ms
# Backoff exponencial: 500ms, depois 1s, depois 2s (multiplicador 2x)
resilience4j.retry.instances.exchangeRateProvider.enable-exponential-backoff=true
resilience4j.retry.instances.exchangeRateProvider.exponential-backoff-multiplier=2

# --- Circuit Breaker ---
# Abre o circuito se 50% das ultimas 10 chamadas falharem
resilience4j.circuitbreaker.instances.exchangeRateProvider.sliding-window-size=10
resilience4j.circuitbreaker.instances.exchangeRateProvider.failure-rate-threshold=50
# Fica "aberto" (rejeitando chamadas sem tentar rede) por 30s antes de
# testar novamente (estado half-open) -- SPEC.md Secao 5: "tentativa
# periodica de half-open no primario (ex: a cada 30s)".
resilience4j.circuitbreaker.instances.exchangeRateProvider.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.exchangeRateProvider.permitted-number-of-calls-in-half-open-state=3